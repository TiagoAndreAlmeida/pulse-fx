services:
  db:
    image: postgres:15-alpine
    container_name: pulse_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: pulse_fx
    ports:
      - "5433:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulse_fx"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pulse_api
    restart: always
    ports:
      - "3333:3333"
    env_file:
      - apps/api/.env
    environment:
      # `environment` tem precedência sobre `env_file`: garante o host `db` do compose
      # mesmo que o .env local aponte para localhost. FRED/ADMIN keys vêm do .env.
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/pulse_fx?schema=public
      - PORT=3333
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_URL=http://localhost:3333
    container_name: pulse_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pulse_pgdata: